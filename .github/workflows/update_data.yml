name: Update data and deploy dashboard

on:
  # Daily at 22:00 UTC (AGSI publishes around 18:00-19:30 CET)
  schedule:
    - cron: '0 22 * * *'
  # Redeploy the dashboard when its code changes (no data fetch)
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'export_site_data.py'
      - 'src/**'
      - '.github/workflows/update_data.yml'
  workflow_dispatch:
    inputs:
      days:
        description: 'Re-fetch at least this many days'
        required: false
        default: '14'
      skip_prices:
        description: 'Skip TTF price fetch'
        type: boolean
        default: false

permissions:
  contents: write   # upload the database to the "data" release
  actions: write    # keep the schedule alive (see last build step)
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  DB_FILE: data/processed/gas_monitor.duckdb
  DATA_RELEASE: data

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      update_ok: ${{ steps.update.outcome != 'failure' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The live database is kept as an asset of the "data" release rather than
      # committed daily, so the git history does not grow by a binary file a day.
      # The copy in the repo is only the seed used on the very first run.
      - name: Restore latest database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$DATA_RELEASE" --pattern gas_monitor.duckdb \
               --dir data/processed --clobber; then
            echo "Restored database from release '$DATA_RELEASE'"
          else
            echo "No '$DATA_RELEASE' release yet - starting from the committed database"
          fi

      - name: Check GIE API key
        if: github.event_name != 'push'
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: |
          if [ -z "$GIE_API_KEY" ]; then
            echo "::error::Repository secret GIE_API_KEY is missing, so storage data cannot be fetched. Add it under Settings > Secrets and variables > Actions (free key: https://agsi.gie.eu/account)."
          fi

      - name: Update data
        id: update
        if: github.event_name != 'push'
        # Keep going so whatever did update (e.g. flows) still gets saved and deployed
        continue-on-error: true
        env:
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '14' }}"
          if [ "${{ github.event.inputs.skip_prices }}" = "true" ]; then
            ARGS="$ARGS --skip-prices"
          fi
          python update_data.py $ARGS

      - name: Export dashboard data
        if: github.event_name == 'push'
        run: python export_site_data.py

      - name: Save database to release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DATA_RELEASE" >/dev/null 2>&1; then
            gh release create "$DATA_RELEASE" --prerelease --title "Latest data" \
              --notes "Database updated daily by the 'Update data and deploy dashboard' workflow."
          fi
          gh release upload "$DATA_RELEASE" "$DB_FILE" --clobber

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Daily runs no longer commit, so re-enable the workflow through
      # the API on each run to reset that timer (same approach as the
      # keepalive-workflow action).
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update_data.yml/enable" || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Fail the run (and email the owner) if a required update step failed, after
  # the partial data has been saved and deployed.
  report:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check update result
        run: |
          if [ "${{ needs.build.outputs.update_ok }}" != "true" ]; then
            echo "::error::One or more required data update steps failed - see the 'Update data' step log."
            exit 1
          fi
